# Overlay for local/dev use, e.g.:
#   helm install edp-dev . -f values-development.yaml -n devsecops-dev --create-namespace

namespace:
  name: devsecops-dev

replicaCount: 1

image:
  tag: "local"
  pullPolicy: IfNotPresent

env:
  nodeEnv: "development"
  logLevel: "debug"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "250m"

hpa:
  enabled: false

ingress:
  host: devsecops.dev.local

networkPolicy:
  # Relaxed for local debugging (port-forward, exec, ad-hoc curl from other
  # dev pods). Keep enabled in staging/production.
  enabled: false
