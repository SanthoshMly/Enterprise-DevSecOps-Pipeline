# TEMPLATE ONLY: the default values.yaml ships an obvious placeholder, not
# a real credential. Override secrets.sessionSecret via --set or a
# non-committed values file backed by your secrets manager / CI secrets --
# never commit real values into values-*.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enterprise-devsecops.fullname" . }}-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "enterprise-devsecops.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
