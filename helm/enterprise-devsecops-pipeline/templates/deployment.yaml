apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "enterprise-devsecops.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "enterprise-devsecops.labels" . | nindent 4 }}
  annotations:
    # Kubernetes uses annotation-based Checkov suppression, not the
    # "# checkov:skip=" comment style used for Terraform/CFN.
    checkov.io/skip1: >-
      CKV_K8S_43=Image tag is set per-environment via values-<env>.yaml and
      pinned to an immutable tag (git SHA in CI) at deploy time.
    checkov.io/skip2: >-
      CKV_K8S_35=SESSION_SECRET is an unused placeholder for a future
      feature, not a live credential yet. Revisit this skip, and switch to
      a mounted secret volume, before anything sensitive is added.
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "enterprise-devsecops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "enterprise-devsecops.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.uid }}
        runAsGroup: {{ .Values.securityContext.uid }}
        fsGroup: {{ .Values.securityContext.uid }}
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: {{ include "enterprise-devsecops.fullname" . }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: {{ .Values.env.port | int }}

        envFrom:
        - configMapRef:
            name: {{ include "enterprise-devsecops.fullname" . }}-config
        - secretRef:
            name: {{ include "enterprise-devsecops.fullname" . }}-secrets

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: {{ .Values.securityContext.uid }}
          capabilities:
            drop:
              - ALL

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        resources:
          {{- toYaml .Values.resources | nindent 10 }}

        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.env.port | int }}
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /ready
            port: {{ .Values.env.port | int }}
          initialDelaySeconds: 5
          periodSeconds: 5

      volumes:
      - name: tmp
        emptyDir: {}
