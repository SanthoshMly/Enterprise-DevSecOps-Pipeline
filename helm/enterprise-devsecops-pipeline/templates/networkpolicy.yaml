{{- if .Values.networkPolicy.enabled }}
# Ingress is left open on the app port: this pod is fronted by a public
# Ingress controller whose namespace/labels vary by installation, so
# restricting source here would be fragile without buying real isolation.
# Egress is restricted to DNS only, since the app makes no outbound calls
# to other services -- add explicit allow rules here if that changes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "enterprise-devsecops.fullname" . }}-netpol
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "enterprise-devsecops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "enterprise-devsecops.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.env.port | int }}
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
