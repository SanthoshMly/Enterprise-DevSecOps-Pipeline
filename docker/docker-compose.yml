services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: enterprise-devsecops-pipeline:local
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      APP_NAME: Enterprise DevSecOps Pipeline
      APP_VERSION: 1.0.0
      LOG_LEVEL: info
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
