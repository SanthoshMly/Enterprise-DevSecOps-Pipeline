apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-devsecops
  namespace: devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-devsecops
  template:
    metadata:
      labels:
        app: enterprise-devsecops
    spec:
      containers:
      - name: enterprise-devsecops
        image: YOUR_DOCKERHUB_USERNAME/enterprise-devsecops-pipeline:v1
        ports:
        - containerPort: 3001

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5