# This file is a TEMPLATE checked in to show the shape of the Secret the
# Deployment expects — it intentionally contains no real credentials.
# In a real environment this manifest is never committed with live values.
# Populate it one of these ways instead:
#   - `kubectl create secret generic ... --from-literal=SESSION_SECRET=...`
#   - Sealed Secrets / External Secrets Operator synced from a vault
#   - Injected by the CI/CD pipeline at deploy time from GitHub Secrets
#
# SESSION_SECRET is a placeholder for future use (e.g. signing sessions or
# JWTs) — the current application does not read it yet, but the Secret/
# envFrom wiring is in place so adding that feature later needs no
# manifest changes.
apiVersion: v1
kind: Secret
metadata:
  name: enterprise-devsecops-secrets
  namespace: devsecops
type: Opaque
stringData:
  SESSION_SECRET: "CHANGE_ME_INJECT_VIA_CI_OR_SECRETS_MANAGER"
