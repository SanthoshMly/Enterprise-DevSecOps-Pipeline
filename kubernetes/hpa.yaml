# Requires the metrics-server addon (`minikube addons enable metrics-server`
# on Minikube; usually pre-installed on managed clusters).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-devsecops-hpa
  namespace: devsecops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-devsecops
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Wait 5 minutes of sustained low load before scaling down, so a
      # brief traffic dip doesn't thrash replicas up and down.
      stabilizationWindowSeconds: 300
