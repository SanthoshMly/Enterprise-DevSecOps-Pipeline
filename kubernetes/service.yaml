apiVersion: v1
kind: Service
metadata:
  name: enterprise-devsecops-service
  namespace: devsecops
spec:
  selector:
    app: enterprise-devsecops

  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001

  # ClusterIP, not NodePort: external access now goes through the Ingress
  # (ingress.yaml) rather than a directly exposed node port.
  type: ClusterIP