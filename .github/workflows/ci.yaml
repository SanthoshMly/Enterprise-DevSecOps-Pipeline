name: Enterprise DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: enterprise-devsecops-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KUBECONFIG: ${{ secrets.KUBE_CONFIG != '' }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep
        id: semgrep
        run: semgrep scan --config=auto --error --sarif --output=semgrep.sarif .
        continue-on-error: true

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/semgrep.sarif
          category: semgrep

      - name: Enforce Semgrep Quality Gate
        if: steps.semgrep.outcome == 'failure'
        run: |
          echo "::error::Semgrep found blocking findings. See the Security tab for details."
          exit 1

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "Enterprise DevSecOps Pipeline"
          path: "app"
          format: "ALL"
          out: "reports/dependency-check"
          args: >
            --failOnCVSS 7
            --suppression security/dependency-check-suppression.xml
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check
          retention-days: 30

      - name: Docker Build
        working-directory: .
        run: docker build -f docker/Dockerfile -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Pinned to the exact commit for trivy-action v0.35.0, NOT the mutable
      # tag. On 2026-03-19 attackers force-pushed malicious code onto 75 of
      # 76 trivy-action tags (GHSA-69fq-xp46-6x23 / CVE-2026-33634), injecting
      # a credential stealer into every tagged release from 0.0.1-0.34.2.
      # Only a SHA pin is immune to a tag being moved after the fact.
      - name: Trivy Image Scan (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Trivy Image Scan (HTML Report)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: template
          template: "@/contrib/html.tpl"
          output: reports/trivy/trivy-report.html
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: reports/trivy
          retention-days: 30

      - name: Trivy Quality Gate (CRITICAL)
        id: trivy-gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Enforce Trivy Quality Gate
        if: steps.trivy-gate.outcome == 'failure'
        run: |
          echo "::error::Trivy found CRITICAL vulnerabilities with an available fix. See the uploaded trivy-image-report artifact and the Security tab."
          exit 1

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint (all environments)
        working-directory: .
        run: |
          helm lint helm/enterprise-devsecops-pipeline
          helm lint helm/enterprise-devsecops-pipeline -f helm/enterprise-devsecops-pipeline/values-development.yaml
          helm lint helm/enterprise-devsecops-pipeline -f helm/enterprise-devsecops-pipeline/values-staging.yaml
          helm lint helm/enterprise-devsecops-pipeline -f helm/enterprise-devsecops-pipeline/values-production.yaml

      - name: Install Checkov
        run: python -m pip install checkov

      # Checkov's CLI can't reliably combine "-o cli -o sarif" into two
      # separate destinations in one invocation (verified locally: it
      # collapses both into a single non-SARIF file). Run it twice instead:
      # once for human-readable console output, once to emit the SARIF file
      # that the exit code actually gates on. `|| true` on the first call
      # stops bash's errexit from skipping the second call when findings fail.
      - name: Checkov IaC Scan (Kubernetes)
        id: checkov-kubernetes
        working-directory: .
        continue-on-error: true
        run: |
          checkov -d kubernetes --framework kubernetes --compact || true
          checkov -d kubernetes --framework kubernetes -o sarif \
            --output-file-path reports/checkov/kubernetes --compact

      - name: Checkov IaC Scan (Dockerfile)
        id: checkov-dockerfile
        working-directory: .
        continue-on-error: true
        run: |
          checkov -f docker/Dockerfile --framework dockerfile --compact || true
          checkov -f docker/Dockerfile --framework dockerfile -o sarif \
            --output-file-path reports/checkov/dockerfile --compact

      - name: Upload Checkov SARIF (Kubernetes) to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov/kubernetes/results_sarif.sarif
          category: checkov-kubernetes

      - name: Upload Checkov SARIF (Dockerfile) to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/checkov/dockerfile/results_sarif.sarif
          category: checkov-dockerfile

      - name: Upload Checkov Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: reports/checkov
          retention-days: 30

      - name: Enforce Checkov Quality Gate
        if: steps.checkov-kubernetes.outcome == 'failure' || steps.checkov-dockerfile.outcome == 'failure'
        run: |
          echo "::error::Checkov found IaC misconfigurations. See the uploaded checkov-report artifact and the Security tab."
          exit 1

      # Everything below only runs on an actual push to main -- never on a
      # pull request -- so forked/PR builds can't push images or touch a
      # live cluster.
      - name: Docker Hub Login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          REMOTE_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$REMOTE_IMAGE:${{ github.sha }}"
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} "$REMOTE_IMAGE:latest"
          docker push "$REMOTE_IMAGE:${{ github.sha }}"
          docker push "$REMOTE_IMAGE:latest"

      # Deploys against whatever cluster KUBE_CONFIG points at. GitHub-hosted
      # runners have no network path to a Minikube instance on a laptop, so
      # this step is a no-op (skipped, not failed) until KUBE_CONFIG is set
      # to a reachable cluster's kubeconfig (base64-encoded). For local
      # Minikube testing, run scripts/deploy-minikube.sh instead.
      - name: Configure Kubeconfig
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_KUBECONFIG == 'true'
        working-directory: .
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Deploy to Kubernetes
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_KUBECONFIG == 'true'
        working-directory: .
        run: |
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/
          kubectl set image deployment/enterprise-devsecops \
            enterprise-devsecops="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -n devsecops
          kubectl rollout status deployment/enterprise-devsecops -n devsecops --timeout=180s

      - name: Smoke Test
        id: smoke-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_KUBECONFIG == 'true'
        working-directory: .
        run: |
          kubectl port-forward -n devsecops svc/enterprise-devsecops-service 8080:80 &
          PF_PID=$!
          sleep 5
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/ready
          curl -sf http://localhost:8080/version
          kill $PF_PID

      - name: Rollback on Failed Deployment or Smoke Test
        if: failure() && (steps.deploy.outcome == 'failure' || steps.smoke-test.outcome == 'failure')
        working-directory: .
        run: |
          echo "::error::Deployment or smoke test failed -- rolling back to the previous revision."
          kubectl rollout undo deployment/enterprise-devsecops -n devsecops
          kubectl rollout status deployment/enterprise-devsecops -n devsecops --timeout=120s

      - name: Pipeline Security Summary
        if: always()
        run: |
          {
            echo "## Security Gate Summary"
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Semgrep (SAST) | ${{ steps.semgrep.outcome }} |"
            echo "| Gitleaks (secrets) | ${{ job.status }} |"
            echo "| OWASP Dependency-Check | (see dependency-check-report artifact) |"
            echo "| Trivy (image CVEs, CRITICAL gate) | ${{ steps.trivy-gate.outcome }} |"
            echo "| Checkov (Kubernetes IaC) | ${{ steps.checkov-kubernetes.outcome }} |"
            echo "| Checkov (Dockerfile) | ${{ steps.checkov-dockerfile.outcome }} |"
            echo "| Deploy to Kubernetes | ${{ steps.deploy.outcome || 'skipped (no KUBE_CONFIG)' }} |"
            echo "| Smoke Test | ${{ steps.smoke-test.outcome || 'skipped (no KUBE_CONFIG)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"